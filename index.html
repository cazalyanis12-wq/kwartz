<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À toi de noter ! - Le Jeu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts pour un look moderne -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 À toi de noter !</h1>
            <p class="subtitle">Devine la note secrète (de 1 à 10) basée sur de vraies références culturelles.</p>
        </header>

        <!-- Barre de contrôle / Choix de catégorie -->
        <div class="control-panel">
            <div class="select-group">
                <label for="category-select">Catégorie :</label>
                <select id="category-select">
                    <option value="random">🎲 Aléatoire à chaque manche</option>
                    <option value="films">🎬 Films & Séries</option>
                    <option value="musique">🎵 Musique & Chansons</option>
                    <option value="jeux">🎮 Jeux Vidéo</option>
                    <option value="nourriture">🍔 Nourriture & Snacks</option>
                </select>
            </div>
            <button id="new-game-btn" class="btn-secondary">🔄 Nouvelle manche</button>
        </div>

        <!-- Zone principale du jeu -->
        <main class="game-card">
            <div class="game-header">
                <span id="category-badge" class="badge">Films & Séries</span>
                <span id="round-info">Manche en cours</span>
            </div>

            <div class="clues-section">
                <h2>Que vaut cette sélection ?</h2>
                <p class="instruction-clue">Voici les indices disponibles. Demande-en plus si tu hésites !</p>
                
                <ul id="clues-list" class="clues-list">
                    <!-- Les indices s'injecteront ici -->
                </ul>

                <button id="more-clue-btn" class="btn-accent">➕ Obtenir un indice supplémentaire</button>
            </div>

            <!-- Zone de réponse -->
            <div class="guess-section">
                <label for="score-range">Quelle est la note secrète ? (<span id="range-val">5</span>/10)</label>
                <div class="range-container">
                    <span>1</span>
                    <input type="range" id="score-range" min="1" max="10" value="5">
                    <span>10</span>
                </div>
                <button id="validate-btn" class="btn-primary">Valider ma réponse</button>
            </div>

            <!-- Résultat (caché au début) -->
            <div id="result-container" class="result-container hidden">
                <div id="result-message"></div>
                <button id="next-round-btn" class="btn-primary">Manche suivante ➔</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
